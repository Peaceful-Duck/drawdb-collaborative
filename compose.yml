services:
  drawdb:
    build: .
    image: drawdb-collaborative
    restart: unless-stopped
    ports:
      # Loopback only: the API and WebSocket are unauthenticated, so reach them
      # through a tunnel or reverse proxy rather than publishing to the LAN.
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/drawdb.sqlite
      # Read from a .env file next to this compose.yml, if present.
      TRUST_PROXY: ${TRUST_PROXY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - drawdb-data:/data

  # Optional: Cloudflare Zero Trust tunnel, off by default. Requires
  # CLOUDFLARE_TUNNEL_TOKEN in .env — see DEPLOYMENT.md#cloudflare-tunnel.
  # Run with: docker compose --profile cloudflare up --build -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - drawdb
    profiles:
      - cloudflare

volumes:
  drawdb-data:
